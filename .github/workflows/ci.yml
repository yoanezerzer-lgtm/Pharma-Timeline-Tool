name: CI

on:
  push:
    branches: ['**']
  pull_request:
    # labeled/unlabeled: re-run the reference guard when correct-reference is added.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The reference guard compares the PR against its base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Schema validation is a build gate: malformed ingested data must fail
      # here rather than render a broken page.
      - name: Validate committed drug records
        run: npm run validate

      # Rule checks plus accuracy against data/reference. Errors and
      # mismatches on confirmed facts fail the build; warnings only report.
      # Confirmed facts can't change in a PR, and new ones arrive in a PR of
      # their own, so no change is graded against answers it wrote itself.
      - name: Reference set guard
        if: github.event_name == 'pull_request'
        env:
          ALLOW_REFERENCE_CORRECTION: ${{ contains(github.event.pull_request.labels.*.name, 'correct-reference') }}
        run: npx tsx scripts/qc/guard.ts "origin/${{ github.base_ref }}"

      - name: Data quality checks
        run: |
          set -o pipefail
          npm run -s qc | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Opens every page of the built site in a browser: catches a page that
      # breaks or comes up empty, which the checks above can't see.
      - name: Site check
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          timeout 30 bash -c 'until curl -sf http://localhost:4173/${{ github.event.repository.name }}/ >/dev/null; do sleep 1; done'
          npx tsx scripts/sitecheck.ts http://localhost:4173/${{ github.event.repository.name }}/
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
