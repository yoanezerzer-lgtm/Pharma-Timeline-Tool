name: Ingest drug data

# Run on demand. The pipeline reads public APIs (openFDA, ClinicalTrials.gov)
# and public FDA PDFs — no API keys, no secrets, no per-run cost.
on:
  workflow_dispatch:
    inputs:
      drug:
        description: >-
          Drug slug. An existing one from scripts/ingest/registry.ts (e.g.
          upadacitinib) re-runs ingestion for that drug. A new slug (use the
          INN, lowercase — e.g. aprocitentan) ingests a brand-new drug, as
          long as the fields below are filled in.
        required: true
        type: string
      brand_name:
        description: 'New drug only, optional if the application is given: the FDA-approved brand name (e.g. Winrevair)'
        required: false
        type: string
      inn:
        description: 'Optional: the INN / generic name. Read from the FDA record when blank'
        required: false
        type: string
      sponsor:
        description: 'Optional: the applicant. Read from the FDA record when blank'
        required: false
        type: string
      modality:
        description: 'Optional: e.g. "Monoclonal antibody". The application type (NDA or BLA) when blank'
        required: false
        type: string
      mechanism:
        description: 'New drug only, optional: one line, e.g. "Selective Janus kinase (JAK1) inhibitor"'
        required: false
        type: string
      application:
        description: >-
          New drug only, optional: "NDA 211675", "BLA 761342", etc. Leave
          blank for a newly approved drug — the pipeline looks the
          application up by brand name instead.
        required: false
        type: string
      refresh:
        description: 'Ignore the on-disk cache and re-fetch everything'
        required: false
        type: boolean
        default: false
      max_lookups:
        description: >-
          Safety cap on registry lookups, not a cost control (each lookup is free).
          Leave this alone unless a run's log says candidates were skipped.
        required: false
        type: string
        default: '3000'

  # The add-drugs workflow runs this once per new drug.
  workflow_call:
    inputs:
      drug: { type: string, required: true }
      application: { type: string, required: false, default: '' }
      brand_name: { type: string, required: false, default: '' }
      inn: { type: string, required: false, default: '' }
      sponsor: { type: string, required: false, default: '' }
      modality: { type: string, required: false, default: '' }
      mechanism: { type: string, required: false, default: '' }
      refresh: { type: boolean, required: false, default: false }
      max_lookups: { type: string, required: false, default: '3000' }

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run ingestion
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          set -euo pipefail

          APP_TYPE=""
          APP_NUMBER=""
          if [ -n "$APPLICATION" ]; then
            if ! echo "$APPLICATION" | grep -qE '^(NDA|BLA|ANDA)[[:space:]]+[A-Za-z0-9-]+$'; then
              echo "::error::'application' must look like 'NDA 211675', 'BLA 761342', or 'ANDA 212345' — or leave it blank."
              exit 1
            fi
            APP_TYPE="${APPLICATION%% *}"
            APP_NUMBER="${APPLICATION#* }"
          fi

          npm run ingest -- \
            --drug "${{ inputs.drug }}" \
            --max-lookups "${{ inputs.max_lookups }}" \
            --brand-name "${{ inputs.brand_name }}" \
            --inn "${{ inputs.inn }}" \
            --sponsor "${{ inputs.sponsor }}" \
            --modality "${{ inputs.modality }}" \
            --mechanism "${{ inputs.mechanism }}" \
            --application-type "$APP_TYPE" \
            --application-number "$APP_NUMBER" \
            ${{ inputs.refresh && '--refresh' || '' }}

      - name: Validate result
        run: npm run validate

      # A new drug gets a reference file with its answers as baseline, for the
      # overnight agent to check. An existing one keeps its own.
      - name: Start a reference file for a new drug
        env:
          DRUG: ${{ inputs.drug }}
        run: |
          if [ ! -f "data/reference/${DRUG}.json" ]; then npm run -s qc -- --snapshot "$DRUG"; fi

      # Reported here, enforced by CI on the pull request.
      - name: Data quality report
        run: npm run -s qc | tee -a "$GITHUB_STEP_SUMMARY" || true

      # Diagnostic: the extracted document text is deliberately gitignored (it
      # never belongs in a diff), which means nobody can actually see what the
      # pipeline read from a real label — only what it concluded. A build
      # artifact (tried first) downloads from Azure blob storage, which isn't
      # reachable from every environment that needs to read it — a plain git
      # branch is. Pushing it here is what makes a role-classification
      # mismatch debuggable from real evidence instead of another guess.
      - name: Push extracted document text to a diagnostic branch
        if: always()
        env:
          DRUG: ${{ inputs.drug }}
        run: |
          set -euo pipefail
          if ! compgen -G "data/raw/*/docs/*.txt" > /dev/null; then
            echo "No extracted document text to push."
            exit 0
          fi
          # One branch per drug, replaced on each run: only the latest text is ever read.
          BRANCH="diag/raw-text-${DRUG}"
          ORIGINAL_REF="$(git rev-parse --abbrev-ref HEAD)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -f data/raw/*/docs/*.txt
          # Answers from services only this workflow can reach (MedlinePlus, MedlinePlus Genetics, the NCI
          # dictionary, MeSH); kept so their format and matches can be checked.
          for kind in medlineplus genetics nci mesh; do
            if compgen -G "data/raw/*/${kind}/*.json" > /dev/null; then git add -f data/raw/*/${kind}/*.json; fi
          done
          git commit -m "Diagnostic: extracted document text for ${DRUG}"
          git push --force origin "$BRANCH"
          echo "Pushed extracted text to branch: $BRANCH"
          # The later "Push the data" step needs to branch from main, not from
          # this diagnostic branch — restore the checkout before it runs.
          git checkout "$ORIGINAL_REF"

      - name: Push the data and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DRUG: ${{ inputs.drug }}
          BASE: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- data/drugs)" ]; then
            echo "No data changes — the sources agree with what is already committed."
            exit 0
          fi

          # One branch per drug, replaced on each run, so it always holds the latest data.
          BRANCH="ingest/${DRUG}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/drugs data/reference
          git commit -m "Ingest data for ${DRUG}"
          git push --force origin "$BRANCH"

          BODY=$(cat <<EOF
          Automated ingestion run for \`${DRUG}\`.

          Data comes from openFDA Drugs@FDA, the FDA approval package PDFs, and
          ClinicalTrials.gov. Nothing here was produced by a language model.

          Review the diff before merging. Every field is marked \`verified: false\`
          until a person checks it, and trial roles are assigned by rule — a trial
          named in section 14 of the approved label is marked pivotal — not by
          inference.

          Any field already marked \`verified: true\` was preserved; conflicts are
          listed in the workflow log.
          EOF
          )

          # Opening a pull request from Actions requires the repository setting
          # "Allow GitHub Actions to create and approve pull requests", which is
          # off by default. The data is already pushed by this point, so a refusal
          # must not fail the run — print the link and let a human click it.
          if gh pr create \
              --title "Ingest: ${DRUG}" \
              --body "$BODY" \
              --base "$BASE" \
              --head "$BRANCH" 2>/tmp/pr-error.txt; then
            echo "Pull request opened."
          else
            echo "::warning::Could not open the pull request automatically."
            sed 's/^/  /' /tmp/pr-error.txt
            echo ""
            echo "The data is safely pushed to branch: $BRANCH"
            echo "Open the pull request here:"
            echo "  ${REPO_URL}/compare/${BASE}...${BRANCH}?expand=1"
            echo ""
            echo "To let this step open pull requests by itself, enable"
            echo "Settings -> Actions -> General -> Workflow permissions ->"
            echo "\"Allow GitHub Actions to create and approve pull requests\"."
          fi
